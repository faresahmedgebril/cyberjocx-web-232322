services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberjocx-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SERVICE_ROLE: api
      PORT: 3000
      APP_WEB_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000
      DATABASE_URL: mysql://cyberjocx:cyberjocx@mysql:3306/cyberjocx
      JWT_SECRET: change-this-development-secret
      SESSION_COOKIE_SAMESITE: lax
      SESSION_COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY: "false"
      STORAGE_PROVIDER: s3
      AI_BASE_URL: https://api.openai.com/v1
      AI_MODEL: gpt-4o-mini
      NVD_API_URL: https://services.nvd.nist.gov/rest/json/cves/2.0
      CRON_SECRET: change-this-development-cron-secret
      LOG_LEVEL: info
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyberjocx-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      SERVICE_ROLE: worker
      DATABASE_URL: mysql://cyberjocx:cyberjocx@mysql:3306/cyberjocx
      NVD_API_URL: https://services.nvd.nist.gov/rest/json/cves/2.0
      LOG_LEVEL: info
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: cyberjocx-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cyberjocx
      MYSQL_USER: cyberjocx
      MYSQL_PASSWORD: cyberjocx
      MYSQL_ROOT_PASSWORD: root-change-this
    ports:
      - "3307:3306"
    volumes:
      - cyberjocx_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cyberjocx_mysql:
