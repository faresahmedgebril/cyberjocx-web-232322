name: Docker Build

on:
  push:
    branches: [main, "deploy/**", "integrate/figma-design-2026-11-03*"]
  pull_request:
    branches: [main]

concurrency:
  group: cyberjocx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false
      - name: Persist updated pnpm lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile"
          git push
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build Cloudflare Worker
        run: pnpm build:cloudflare-worker
      - name: Upload Cloudflare Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-bundle
          path: dist/cloudflare-worker.js
          if-no-files-found: error
          retention-days: 7
      - name: Verify production Worker health, Neon readiness and OAuth starts
        shell: bash
        env:
          API_URL: https://cyberjocx-api.gebrilfares972.workers.dev
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            "${API_URL}/health" -o /tmp/worker-health.json
          node --input-type=module -e '
            const data = JSON.parse(await (await import("node:fs/promises")).readFile("/tmp/worker-health.json", "utf8"));
            if (data.ok !== true || data.service !== "cyberjocx-api") throw new Error("Worker health response is invalid");
            console.log("Worker health passed");
          '

          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 30 \
            "${API_URL}/ready" -o /tmp/worker-ready.json
          node --input-type=module -e '
            const data = JSON.parse(await (await import("node:fs/promises")).readFile("/tmp/worker-ready.json", "utf8"));
            if (data.ok !== true || data.database !== true) throw new Error("Neon readiness check failed");
            console.log("Neon readiness passed");
          '

          for provider in github google; do
            headers="/tmp/${provider}-oauth.headers"
            body="/tmp/${provider}-oauth.body"
            status="$(curl --silent --show-error --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' \
              "${API_URL}/api/auth/${provider}/login")"
            test "$status" = "302"
            grep -Eqi "^location: https://(github\\.com|accounts\\.google\\.com)/" "$headers"
            grep -Eqi "^set-cookie: __Host-cyberjocx_${provider}_oauth_state=" "$headers"
            grep -Eqi 'HttpOnly' "$headers"
            grep -Eqi 'Secure' "$headers"
          done
          echo "GitHub and Google OAuth initiation passed"

      - name: Verify production all-time leaderboard
        shell: bash
        env:
          API_URL: https://cyberjocx-api.gebrilfares972.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 \
            "$API_URL/api/trpc/leaderboard.list?input=%7B%22json%22%3A%7B%22period%22%3A%22all-time%22%7D%7D")"
          node --input-type=module -e '
            const payload = JSON.parse(process.argv[1]);
            const data = payload?.result?.data?.json ?? payload?.result?.data;
            if (!data || !Array.isArray(data.entries)) throw new Error("Production leaderboard response is invalid");
            if (!Number.isFinite(Number(data.totalMembers))) throw new Error("Production member count is invalid");
            for (const entry of data.entries) {
              if (!Number.isFinite(Number(entry.points))) throw new Error("Invalid leaderboard points");
              for (const field of ["email", "passwordHash", "passwordResetTokenHash", "sessionToken"]) {
                if (Object.hasOwn(entry, field)) throw new Error("Sensitive field leaked: " + field);
              }
            }
            console.log("Production leaderboard passed:", data.entries.length, "ranked users;");
          ' "$response"
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cyberjocx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy production Cloudflare Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 91f0bdcf3f87b86358d38b5f7559dff1
          WORKER_NAME: cyberjocx-api
        run: |
          set -euo pipefail

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Account.Workers Scripts Write permission."
            exit 1
          fi

          cat > /tmp/cyberjocx-worker-metadata.json <<'JSON'
          {
            "main_module": "cloudflare-worker.js",
            "compatibility_date": "2026-11-01",
            "compatibility_flags": ["nodejs_compat"],
            "usage_model": "standard",
            "bindings": [
              {"type":"plain_text","name":"API_BASE_URL","text":"https://cyberjocx-api.gebrilfares972.workers.dev"},
              {"type":"plain_text","name":"APP_WEB_URL","text":"https://faresahmedgebril.github.io/cyberjocx-web-232322"},
              {"type":"plain_text","name":"AUTH_RATE_LIMIT","text":"20"},
              {"type":"plain_text","name":"CORS_ORIGINS","text":"https://cyberjocx-api.gebrilfares972.workers.dev,https://faresahmedgebril.github.io"},
              {"type":"hyperdrive","name":"HYPERDRIVE","id":"e561e68997b24fe58d158ee786def876"},
              {"type":"plain_text","name":"NODE_ENV","text":"production"},
              {"type":"plain_text","name":"PORT","text":"3000"},
              {"type":"plain_text","name":"PUBLIC_API_RATE_LIMIT","text":"300"},
              {"type":"plain_text","name":"SERVICE_ROLE","text":"api"}
            ],
            "observability": {
              "enabled": true,
              "head_sampling_rate": 1,
              "redact_query_string": false,
              "logs": {
                "enabled": true,
                "head_sampling_rate": 1,
                "persist": true,
                "invocation_logs": true
              },
              "traces": {
                "enabled": false,
                "persist": true,
                "head_sampling_rate": 1
              }
            }
          }
          JSON

          upload_response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F "metadata=@/tmp/cyberjocx-worker-metadata.json;type=application/json" \
            -F "files=@dist/cloudflare-worker.js;type=application/javascript+module" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/versions")"

          version_id="$(jq -er '.result.id' <<< "${upload_response}")"
          echo "Uploaded Cloudflare Worker version: ${version_id}"

          deployment_payload="$(jq -n --arg version_id "${version_id}" '{
            strategy: "percentage",
            versions: [{version_id: $version_id, percentage: 100}],
            annotations: {"workers/message": "Deploy tested CyberJocx main build"}
          }')"

          deployment_response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${deployment_payload}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${WORKER_NAME}/deployments")"

          deployment_id="$(jq -er '.result.id' <<< "${deployment_response}")"
          echo "Cloudflare Worker deployment created: ${deployment_id}"

          for endpoint in health ready; do
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --max-time 30 \
              "https://cyberjocx-api.gebrilfares972.workers.dev/${endpoint}" \
              -o "/tmp/worker-${endpoint}.json"
          done

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const health = JSON.parse(fs.readFileSync("/tmp/worker-health.json", "utf8"));
          const ready = JSON.parse(fs.readFileSync("/tmp/worker-ready.json", "utf8"));
          if (health.ok !== true || health.service !== "cyberjocx-api") throw new Error("Post-deploy Worker health check failed");
          if (ready.ok !== true || ready.database !== true) throw new Error("Post-deploy Neon readiness check failed");
          console.log("Post-deploy Worker health and Neon readiness passed");
          NODE
