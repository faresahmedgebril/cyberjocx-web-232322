name: Docker Build

on:
  push:
    branches: [main, "deploy/**", "integrate/figma-design-2026-11-03*"]
  pull_request:
    branches: [main]

concurrency:
  group: cyberjocx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false
      - name: Persist updated pnpm lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update pnpm lockfile"
          git push
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build Cloudflare Worker
        run: pnpm build:cloudflare-worker
      - name: Smoke test production API and database readiness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_URL: https://cyberjocx-api.gebrilfares972.workers.dev
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 --max-time 20 "$API_URL/health")"
          ready="$(curl --fail --silent --show-error --retry 4 --retry-delay 3 --max-time 20 "$API_URL/ready")"
          printf 'Health: %s\n' "$health"
          printf 'Readiness: %s\n' "$ready"
          node --input-type=module -e '
            const health = JSON.parse(process.argv[1]);
            const ready = JSON.parse(process.argv[2]);
            if (health.ok !== true) throw new Error("Worker health check did not return ok=true");
            if (ready.ok !== true || ready.database !== true) throw new Error("Worker could not confirm database readiness");
          ' "$health" "$ready"
          cron_status="$(curl --silent --show-error --max-time 20 -o /tmp/cron-unauthorized.json -w '%{http_code}' -X POST "$API_URL/api/scheduled/nvd-sync" -H 'content-type: application/json' -d '{}')"
          cat /tmp/cron-unauthorized.json
          test "$cron_status" = "403"
      - name: Verify production all-time leaderboard
        shell: bash
        env:
          API_URL: https://cyberjocx-api.gebrilfares972.workers.dev
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 \
            "$API_URL/api/trpc/leaderboard.list?input=%7B%22json%22%3A%7B%22period%22%3A%22all-time%22%7D%7D")"
          node --input-type=module -e '
            const payload = JSON.parse(process.argv[1]);
            const data = payload?.result?.data?.json ?? payload?.result?.data;
            if (!data || !Array.isArray(data.entries)) throw new Error("Production leaderboard response is invalid");
            if (!Number.isFinite(Number(data.totalMembers))) throw new Error("Production member count is invalid");
            for (const entry of data.entries) {
              if (!Number.isFinite(Number(entry.points))) throw new Error("Invalid leaderboard points");
              for (const field of ["email", "passwordHash", "passwordResetTokenHash", "sessionToken"]) {
                if (Object.hasOwn(entry, field)) throw new Error("Sensitive field leaked: " + field);
              }
            }
            console.log("Production leaderboard passed:", data.entries.length, "ranked users;");
          ' "$response"
      - name: Smoke test production authentication routes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_URL: https://cyberjocx-api.gebrilfares972.workers.dev
          FRONTEND_ORIGIN: https://faresahmedgebril.github.io
        run: |
          set -euo pipefail
          mkdir -p /tmp/cyberjocx-auth-smoke

          login_status="$(curl --silent --show-error --max-time 20 -D /tmp/cyberjocx-auth-smoke/login.headers -o /tmp/cyberjocx-auth-smoke/login.json -w '%{http_code}' -X POST "$API_URL/api/auth/login" -H "Origin: $FRONTEND_ORIGIN" -H 'content-type: application/json' -d '{"email":"unregistered-auth-smoke@example.invalid","password":"not-the-password"}')"
          printf 'Invalid password login HTTP status: %s\n' "$login_status"
          test "$login_status" = "401"
          grep -Fqi "access-control-allow-origin: $FRONTEND_ORIGIN" /tmp/cyberjocx-auth-smoke/login.headers
          grep -Eiq '^access-control-allow-credentials: true' /tmp/cyberjocx-auth-smoke/login.headers
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync("/tmp/cyberjocx-auth-smoke/login.json", "utf8"));
            if (body.ok !== false || body.message !== "Invalid email or password.") {
              throw new Error("Login did not return the generic invalid-credentials response");
            }
          '

          for provider in google github; do
            headers="/tmp/cyberjocx-auth-smoke/$provider.headers"
            status="$(curl --silent --show-error --max-time 20 -D "$headers" -o /dev/null -w '%{http_code}' "$API_URL/api/auth/$provider/login")"
            printf '%s OAuth start HTTP status: %s\n' "$provider" "$status"
            test "$status" = "302"
            if [ "$provider" = "google" ]; then
              grep -Eiq '^location: https://accounts\.google\.com/o/oauth2/v2/auth' "$headers"
            else
              grep -Eiq '^location: https://github\.com/login/oauth/authorize' "$headers"
            fi
            grep -Eiq "^set-cookie: __Host-cyberjocx_${provider}_oauth_state=.*HttpOnly.*Secure.*SameSite=Lax" "$headers"
            location="$(awk 'BEGIN { IGNORECASE=1 } /^location:/ { sub(/\r$/, ""); sub(/^[^:]*:[[:space:]]*/, ""); print; exit }' "$headers")"
            node --input-type=module -e '
              const provider = process.argv[1];
              const location = new URL(process.argv[2]);
              const expected = `https://cyberjocx-api.gebrilfares972.workers.dev/api/auth/${provider}/callback`;
              if (location.searchParams.get("redirect_uri") !== expected) {
                throw new Error(provider + " OAuth callback URL mismatch");
              }
              if (!location.searchParams.get("state")) {
                throw new Error(provider + " OAuth state parameter is missing");
              }
            ' "$provider" "$location"
          done

          for provider in google github; do
            state_status="$(curl --silent --show-error --max-time 20 -D "/tmp/cyberjocx-auth-smoke/$provider-invalid-state.headers" -o /dev/null -w '%{http_code}' "$API_URL/api/auth/$provider/callback?code=invalid&state=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA")"
            printf '%s callback without state cookie HTTP status: %s\n' "$provider" "$state_status"
            test "$state_status" = "302"
            grep -Fqi "authError=$provider-state" "/tmp/cyberjocx-auth-smoke/$provider-invalid-state.headers"
          done

          logout_status="$(curl --silent --show-error --max-time 20 -D /tmp/cyberjocx-auth-smoke/logout.headers -o /tmp/cyberjocx-auth-smoke/logout.json -w '%{http_code}' -X POST "$API_URL/api/trpc/auth.logout?batch=1" -H "Origin: $FRONTEND_ORIGIN" -H 'content-type: application/json' --data '{"0":{"json":null}}')"
          printf 'Unauthenticated logout HTTP status: %s\n' "$logout_status"
          test "$logout_status" = "200"
          grep -Eiq '^set-cookie: cyberjocx_session=' /tmp/cyberjocx-auth-smoke/logout.headers
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const body = JSON.parse(readFileSync("/tmp/cyberjocx-auth-smoke/logout.json", "utf8"));
            if (!JSON.stringify(body).includes(String.fromCharCode(34) + "success" + String.fromCharCode(34) + ":true")) {
              throw new Error("Logout mutation did not report success");
            }
          '
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cyberjocx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
