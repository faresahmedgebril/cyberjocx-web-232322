name: Extract Figma design source
on:
  push:
    branches:
      - integrate-figma-design
    paths:
      - .github/workflows/extract-figma.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integrate-figma-design
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Extract design archive for inspection
        run: |
          mkdir -p /tmp/figma-design figma-source
          unzip -o "Create my design.zip" -d /tmp/figma-design
          cp -R /tmp/figma-design/src figma-source/
          cp /tmp/figma-design/package.json /tmp/figma-design/index.html /tmp/figma-design/vite.config.ts /tmp/figma-design/tsconfig.json figma-source/
          mkdir -p figma-source/public client/public/assets
          cp -R /tmp/figma-design/public/assets figma-source/public/
          cp -R /tmp/figma-design/public/assets/. client/public/assets/
          cp /tmp/figma-design/src/index.css figma-source/index.css
      - name: Build frontend for verification
        run: |
          pnpm install --frozen-lockfile
          pnpm build:client
      - name: Commit extracted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figma-source client/public/assets
          git commit -m "chore: extract Figma design source for integration" || exit 0
          git push