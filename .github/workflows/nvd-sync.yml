name: Hourly NVD sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-nvd-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake Render and enqueue NVD sync
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
          CRON_SECRET: ${{ secrets.RENDER_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "Missing RENDER_API_URL or RENDER_CRON_SECRET repository secret." >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 8 --retry-delay 15 --retry-all-errors \
            --max-time 45 \
            -X POST "${API_URL%/}/api/scheduled/nvd-sync" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "content-type: application/json" \
            -d '{}'
