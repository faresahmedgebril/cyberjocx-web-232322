name: Cloudflare Worker Production Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cyberjocx-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Cloudflare Worker
        run: pnpm build:cloudflare-worker

      - name: Deploy Worker and verify production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node scripts/deploy-cloudflare-worker.mjs

      - name: Report missing Cloudflare API token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::Worker bundle was built and tested, but production upload was skipped because the CLOUDFLARE_API_TOKEN GitHub Actions secret is not configured."
          echo "Add a scoped Cloudflare API token with Workers Scripts Write permission to enable automatic production releases."
