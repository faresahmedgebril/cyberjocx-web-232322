name: Cloudflare Worker Production Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberjocx-cloudflare-worker-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Cloudflare Worker
        run: pnpm build:cloudflare-worker

      - name: Preserve the tested Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: cyberjocx-cloudflare-worker
          path: dist/cloudflare-worker.js
          if-no-files-found: error
          retention-days: 7

      - name: Require Cloudflare API token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::error::CLOUDFLARE_API_TOKEN is missing. Production deployment was not attempted."
          echo "Add a valid Cloudflare API token scoped to this account with Workers Scripts: Write permission."
          exit 1

      - name: Deploy Worker and verify production
        run: node scripts/deploy-cloudflare-worker.mjs
