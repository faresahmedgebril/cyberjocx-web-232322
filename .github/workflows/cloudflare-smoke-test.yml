name: Cloudflare login API smoke test

on:
  push:
    branches: [deploy/cloudflare-workers-mvp]
    paths:
      - "client/**"
      - "cloudflare/**"
      - "server/**"
      - "drizzle/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/cloudflare-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deployed Worker health and Neon connectivity
        env:
          BASE_URL: https://cyberjocx-api.gebrilfares972.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/health" | tee /tmp/health.json
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/ready" | tee /tmp/ready.json
          grep -q '"database":true' /tmp/ready.json

      - name: Verify proxied login page
        env:
          BASE_URL: https://cyberjocx-api.gebrilfares972.workers.dev
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/cyberjocx-web-232322/login" -o /tmp/login.html
          grep -qi "CyberJocx" /tmp/login.html

      - name: Verify password login route reaches Neon without writing data
        env:
          BASE_URL: https://cyberjocx-api.gebrilfares972.workers.dev
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error --max-time 30 \
            -o /tmp/auth-login.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/auth/login" \
            -H "Origin: $BASE_URL" \
            -H "Referer: $BASE_URL/cyberjocx-web-232322/login" \
            -H "Content-Type: application/json" \
            --data '{"email":"cloudflare-smoke-check@example.invalid","password":"invalid-smoke-password"}')"
          test "$STATUS" = "401"
          jq -e '.ok == false and .message == "Invalid email or password."' /tmp/auth-login.json
