# Render Free: a Static Site for the Vite frontend and one Web Service for API + embedded queue worker.
# Hourly NVD sync is triggered by .github/workflows/nvd-sync.yml because Render Free
# does not provide free standalone Background Worker or Cron instances.
services:
  - type: web
    name: cyberjocx-api-232322
    runtime: node
    plan: free
    region: frankfurt
    branch: deploy/render-neon-free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm build && pnpm db:generate
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SERVICE_ROLE
        value: api
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: APP_WEB_URL
        value: https://cyberjocx-web-232322.onrender.com
      - key: CORS_ORIGINS
        value: https://cyberjocx-web-232322.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: NVD_API_URL
        value: https://services.nvd.nist.gov/rest/json/cves/2.0
      - key: LOG_LEVEL
        value: info

  - type: web
    name: cyberjocx-web-232322
    runtime: static
    branch: deploy/render-neon-free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm build:client
    staticPublishPath: ./dist/public
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cyberjocx-api-232322.onrender.com
