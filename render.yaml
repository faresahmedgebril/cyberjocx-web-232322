# Render Free: one web service hosts the frontend, API and embedded queue worker.
# Hourly NVD sync is triggered by .github/workflows/nvd-sync.yml because free
# Render instances do not include standalone Background Worker or Cron services.
services:
  - type: web
    name: cyberjocx-api
    runtime: node
    plan: free
    region: frankfurt
    branch: deploy/render-neon-free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile --prod=false && pnpm build && pnpm db:generate
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SERVICE_ROLE
        value: api
      - key: PORT
        value: "10000"
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: NVD_API_URL
        value: https://services.nvd.nist.gov/rest/json/cves/2.0
      - key: LOG_LEVEL
        value: info
